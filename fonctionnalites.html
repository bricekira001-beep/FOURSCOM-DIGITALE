<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle Fonctionnalité</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            padding-top: 80px;
        }

        /* Boutons lumineux */
        .btn-lumineux{
            background: #0066B3;
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            animation: glow 2s infinite;
        }

        .btn-lumineux:hover{
            transform: scale(1.05);
        }

        @keyframes glow{
            0%{
                box-shadow: 0 0 5px rgba(0,102,179,0.5);
            }
            50%{
                box-shadow: 
                    0 0 20px rgba(0,102,179,0.9),
                    0 0 40px rgba(217,21,43,0.7),
                    0 0 60px rgba(255,210,60,0.6);
            }
            100%{
                box-shadow: 0 0 5px rgba(0,102,179,0.5);
            }
        }
    </style>

</head>
<body>

    <h1>Ma nouvelle fonctionnalité</h1>
    <p>Ici je peux ajouter mes nouvelles options.</p>

    <button class="btn-lumineux">Ma Bible</button>
    <button class="btn-lumineux">Mes Notes</button>

</body>
</html>
